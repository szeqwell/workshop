# HTTP server configuration
quarkus.http.port=18181

# Metrics - Prometheus registry via Micrometer
quarkus.micrometer.enabled=true
quarkus.micrometer.export.prometheus.enabled=true
# Expose at the standard management path
quarkus.micrometer.export.prometheus.path=/q/metrics
# Common binders (these are true by default; set explicitly for clarity)
quarkus.micrometer.binder.http-server.enabled=true
quarkus.micrometer.binder.jvm.enabled=true
quarkus.micrometer.binder.system.enabled=true
quarkus.micrometer.binder.vertx.enabled=true
